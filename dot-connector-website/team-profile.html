<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Meet a member of The Dot Connector team." />
  <title>Team Profile | The Dot Connector</title>
  <style>
    :root { --blue:#457B9D; --purple:#8338EC; --dark:#1A1A2E; --mid:#4A4A6A; --line:#E4E8F2; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { min-height:100vh; background:linear-gradient(160deg,#fff 0%,#f2f6ff 100%); color:var(--dark); font-family:"Segoe UI",Arial,sans-serif; }
    nav { height:68px; padding:0 40px; border-bottom:1px solid #eeeef3; background:rgba(255,255,255,.95); display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:10; backdrop-filter:blur(14px); }
    nav img { display:block; height:44px; }
    nav div { display:flex; align-items:center; gap:28px; }
    nav div a { color:var(--mid); font-size:.9rem; font-weight:700; text-decoration:none; }
    .connect { border-radius:24px; background:var(--blue); color:#fff!important; padding:9px 20px; }
    main { width:min(1120px,calc(100% - 48px)); margin:0 auto; padding:68px 0 84px; }
    .back { display:inline-block; margin-bottom:28px; color:var(--blue); font-size:.88rem; font-weight:800; text-decoration:none; }
    .profile { display:grid; grid-template-columns:minmax(280px,410px) minmax(0,1fr); gap:clamp(42px,7vw,88px); align-items:start; }
    .photo-wrap { position:sticky; top:104px; }
    .photo { width:100%; aspect-ratio:4/5; overflow:hidden; border-radius:10px; background:#eaf0fb; box-shadow:0 22px 54px rgba(26,26,46,.16); border-bottom:6px solid var(--blue); }
    .photo img { width:100%; height:100%; display:block; object-fit:cover; object-position:var(--portrait-position,center 18%); }
    .initials { width:100%; height:100%; display:grid; place-items:center; background:linear-gradient(135deg,#edf2ff,var(--blue)); color:#fff; font-size:4rem; font-weight:900; }
    .eyebrow { color:var(--blue); font-size:.78rem; font-weight:900; letter-spacing:.12em; text-transform:uppercase; margin-bottom:14px; }
    h1 { font-size:clamp(2.5rem,5vw,4.5rem); line-height:1; margin-bottom:14px; }
    .role { color:var(--blue); font-size:1.16rem; font-weight:800; margin-bottom:30px; }
    .bio { max-width:720px; color:var(--mid); font-size:1.05rem; line-height:1.82; }
    .bio p { margin-bottom:1.25em; }
    .contacts { display:flex; flex-wrap:wrap; gap:10px; margin-top:32px; }
    .contacts a { border:1px solid var(--line); border-radius:999px; background:#fff; color:var(--dark); padding:10px 17px; font-size:.86rem; font-weight:800; text-decoration:none; }
    .loading { color:var(--mid); font-size:1.1rem; }
    footer { padding:28px 24px; background:var(--dark); color:rgba(255,255,255,.62); text-align:center; font-size:.88rem; }
    footer strong { color:#fff; }
    @media(max-width:760px) {
      nav { padding:0 20px; } nav div a:not(.connect) { display:none; }
      main { width:calc(100% - 40px); padding-top:36px; }
      .profile { grid-template-columns:1fr; gap:34px; }
      .photo-wrap { position:static; }
      .photo { aspect-ratio:4/4.5; }
      h1 { font-size:clamp(2.5rem,12vw,3.8rem); }
      .bio { font-size:1rem; line-height:1.75; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" aria-label="The Dot Connector home"><img src="logo.png" alt="The Dot Connector logo" /></a>
    <div><a href="about.html">About</a><a href="our-team.html">Our Team</a><a class="connect" href="contact.html">Connect</a></div>
  </nav>
  <main>
    <a class="back" href="our-team.html">← Back to Our Team</a>
    <div id="profile" class="loading">Loading profile…</div>
  </main>
  <footer><strong>The Dot Connector</strong> &nbsp;|&nbsp; Strategic relationships. Meaningful results.</footer>
  <script>
    var people = {
      "richard-buckman":"Richard “Buck” Buckman", "kim-buckman":"Kim Buckman",
      "michael-vardoulis":"Michael Vardoulis", "andy-griffith":"Andrew “Andy” Griffith",
      "doug-adams":"John Douglas “Doug” Adams", "rod-mcculloch":"Rod McCulloch"
    };
    var slug = new URLSearchParams(location.search).get("member");
    var wanted = people[slug];
    var target = document.getElementById("profile");
    if (!wanted) {
      target.innerHTML = "Profile not found. <a href=\"our-team.html\">Return to Our Team</a>.";
    } else {
      fetch("our-team.html").then(function(r){ return r.text(); }).then(function(html){
        var doc = new DOMParser().parseFromString(html,"text/html");
        var cards = Array.from(doc.querySelectorAll(".team-card"));
        var card = cards.find(function(c){ return c.querySelector("h2").textContent.trim() === wanted; });
        if (!card) throw new Error("Missing profile");
        var name = card.querySelector("h2").textContent;
        var role = card.querySelector(".role").textContent;
        var portrait = card.querySelector(".portrait").innerHTML;
        var bio = Array.from(card.querySelectorAll(".bio p")).map(function(p){ return p.outerHTML; }).join("");
        var contacts = Array.from(card.querySelectorAll(".contact-row a:not(.more-btn)")).map(function(a){ return a.outerHTML; }).join("");
        document.title = name + " | The Dot Connector";
        target.className = "profile";
        target.innerHTML = '<div class="photo-wrap"><div class="photo">'+portrait+'</div></div><article><p class="eyebrow">Our Team</p><h1>'+name+'</h1><p class="role">'+role+'</p><div class="bio">'+bio+'</div><div class="contacts">'+contacts+'</div></article>';
      }).catch(function(){ target.innerHTML = "This profile could not be loaded. <a href=\"our-team.html\">Return to Our Team</a>."; });
    }
  </script>
</body>
</html>
